name: Atualizar briefings (cron)

# Agendador externo confiável para o pipeline de geração de briefings.
# O cron do Vercel no plano Hobby se mostrou não-confiável (e a função tem
# limite de 60s). Este workflow chama o endpoint protegido em lotes pequenos,
# várias vezes, para gerar volume sem estourar o limite de tempo da função.
on:
  schedule:
    - cron: "0 7 * * *" # diariamente às 07:00 UTC
  workflow_dispatch:
    inputs:
      rounds:
        description: "Quantas chamadas em sequência"
        required: false
        default: "3"

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar briefings em lotes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://statecraftcyber.vercel.app/api/cron/update-briefings
          ROUNDS: ${{ github.event.inputs.rounds || '3' }}
          BATCH: "4"
        run: |
          ok=0
          for i in $(seq 1 "$ROUNDS"); do
            echo "── Rodada $i/$ROUNDS (max=$BATCH) ──"
            code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
              --max-time 90 \
              -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${BASE_URL}?max=${BATCH}" || echo "000")
            echo "HTTP $code"; cat /tmp/resp.json 2>/dev/null; echo
            if [ "$code" = "200" ]; then ok=$((ok+1)); fi
            sleep 5
          done
          echo "Rodadas bem-sucedidas: $ok/$ROUNDS"
          if [ "$ok" -eq 0 ]; then
            echo "::error::Nenhuma rodada de geração teve sucesso"
            exit 1
          fi
