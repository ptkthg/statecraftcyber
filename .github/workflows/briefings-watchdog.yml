name: Verificar atualização
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: vars.UPDATES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-updates.mjs
        env:
          SITE_ORIGIN: https://statecraftcyber.vercel.app
